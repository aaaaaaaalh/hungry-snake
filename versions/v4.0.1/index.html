<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>贪吃蛇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 55%, #020617 100%);
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .card {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 20px;
    padding: 20px 24px 28px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    width: 100%;
    max-width: 520px;
    text-align: center;
  }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 26px; letter-spacing: 6px; color: #4ade80; text-shadow: 0 0 18px rgba(74, 222, 128, 0.45); }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: #1e293b; border: 1px solid #334155; border-radius: 999px;
    padding: 4px 12px 4px 6px; cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .user-chip:hover { border-color: #4ade80; }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .sound-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    font-size: 16px; cursor: pointer; line-height: 1;
    transition: border-color 0.15s ease;
  }
  .sound-btn:hover { border-color: #4ade80; }
  .music-panel { max-width: 520px; }
  .music-upload-row { display: flex; justify-content: center; margin-top: 4px; }
  .btn.small { padding: 8px 20px; font-size: 14px; margin-top: 0; }
  .music-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; max-height: 300px; overflow-y: auto; }
  .music-empty { padding: 18px 0; color: #64748b; font-size: 13px; }
  .track-item { display: flex; align-items: center; gap: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; }
  .track-item.active { border-color: #4ade80; box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.35); }
  .track-info { flex: 1; min-width: 0; text-align: left; }
  .track-name { font-size: 14px; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #052e16; color: #4ade80; font-size: 11px; vertical-align: 1px; }
  .track-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
  .mini-btn { padding: 6px 12px; font-size: 13px; border-radius: 999px; border: 1px solid #334155; background: #0f172a; color: #cbd5e1; cursor: pointer; white-space: nowrap; }
  .mini-btn:hover { border-color: #4ade80; color: #4ade80; }
  .mini-btn.pick { background: linear-gradient(180deg, #4ade80, #22c55e); color: #052e16; border: none; font-weight: 600; }
  .mini-btn.pick:hover { color: #052e16; }
  .mini-btn.danger { color: #f87171; }
  .mini-btn.danger:hover { border-color: #f87171; color: #f87171; }
  .music-note { font-size: 12px; color: #64748b; text-align: left; margin-top: 12px; line-height: 1.7; }

  .chip-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: #22c55e;
  }
  .chip-name { font-size: 13px; color: #e2e8f0; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { display: flex; justify-content: center; gap: 40px; margin-bottom: 14px; font-size: 16px; }
  .stats b { color: #fbbf24; font-size: 20px; }
  .board-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #0b1220; border: 2px solid rgba(74, 222, 128, 0.25); box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6); }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .hint { margin-top: 14px; font-size: 13px; color: #94a3b8; line-height: 1.8; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 5px; padding: 1px 7px; font-family: inherit; font-size: 12px; }
  .btn {
    margin-top: 14px; padding: 10px 34px; font-size: 16px; font-weight: 600;
    color: #052e16; background: linear-gradient(180deg, #4ade80, #22c55e);
    border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(34, 197, 94, 0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(34, 197, 94, 0.5); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: #1e293b; color: #cbd5e1; box-shadow: none; border: 1px solid #334155; }
  .btn.ghost:hover { border-color: #4ade80; color: #4ade80; }
  .btn.danger { background: linear-gradient(180deg, #f87171, #ef4444); color: #fff; box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35); }

  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(2, 6, 23, 0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow-y: auto;
  }
  .panel {
    background: #0f172a; border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 18px; padding: 24px; width: 100%; max-width: 400px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
  }
  .panel h2 { text-align: center; color: #4ade80; margin-bottom: 14px; font-size: 22px; letter-spacing: 3px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 8px 0; background: #1e293b; color: #94a3b8;
    border: 1px solid #334155; border-radius: 10px; cursor: pointer; font-size: 14px;
  }
  .tab.active { background: #052e16; color: #4ade80; border-color: #4ade80; }
  .panel input[type="text"], .panel input[type="password"] {
    width: 100%; margin-bottom: 10px; padding: 10px 12px;
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 10px;
    font-size: 14px; outline: none;
  }
  .panel input:focus { border-color: #4ade80; }
  .panel input::placeholder { color: #64748b; }
  .avatar-label { text-align: left; font-size: 13px; color: #94a3b8; margin: 8px 0 6px; }
  .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .avatar-item, .color-item {
    aspect-ratio: 1; border-radius: 10px; border: 2px solid #334155;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 20px; background: #1e293b; padding: 0;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .avatar-item:hover, .color-item:hover { border-color: #64748b; }
  .avatar-item.selected, .color-item.selected { border-color: #4ade80; box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.4); }
  .custom-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .custom-row input { flex: 1; margin-bottom: 0 !important; }
  .color-row { display: flex; gap: 6px; }
  .color-item { width: 30px; height: 30px; border-radius: 50%; }
  .error { color: #f87171; font-size: 13px; text-align: left; min-height: 18px; margin: 2px 0 6px; }
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .big-avatar { width: 56px; height: 56px; border-radius: 50%; font-size: 30px; display: flex; align-items: center; justify-content: center; background: #22c55e; }
  .profile-nick { font-size: 18px; font-weight: 600; }
  .profile-user { font-size: 13px; color: #64748b; }
  .profile-stats { display: flex; justify-content: space-around; background: #1e293b; border-radius: 12px; padding: 10px 0; margin-bottom: 14px; font-size: 13px; color: #94a3b8; }
  .profile-stats b { display: block; font-size: 18px; color: #fbbf24; margin-top: 2px; }
  .edit-section { border-top: 1px solid #334155; padding-top: 12px; }
  .panel .btn { width: 100%; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <h1>贪吃蛇</h1>
    <div class="top-right">
      <button type="button" class="sound-btn" id="soundBtn" title="开关声音">🔊</button>
      <button type="button" class="sound-btn" id="musicBtn" title="音乐库">🎵</button>
      <div class="user-chip" id="userChip" title="打开个人资料" hidden>
        <span class="chip-avatar" id="chipAvatar">🐍</span>
        <span class="chip-name" id="chipName">玩家</span>
      </div>
    </div>
  </div>
  <div class="stats">
    <div>得分 <b id="score">0</b></div>
    <div>最高 <b id="best">0</b></div>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
  <div class="hint">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> / <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向 &nbsp;
    <kbd>空格</kbd> 暂停 / 继续 &nbsp; <kbd>R</kbd> 重新开始<br/>
    手机滑动控制 · 🔊 开关声音 · 🎵 音乐库 · 点击头像编辑个人资料
  </div>
</div>

<div class="overlay" id="authOverlay">
  <div class="panel">
    <h2>贪吃蛇</h2>
    <div class="tabs">
      <button type="button" class="tab active" id="tabLogin">登录</button>
      <button type="button" class="tab" id="tabRegister">注册</button>
    </div>
    <form id="loginForm">
      <input id="loginUser" type="text" placeholder="用户名" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password" />
      <div class="error" id="loginError"></div>
      <button type="submit" class="btn">登录</button>
      <button type="button" class="btn ghost" id="guestBtn">先随便玩玩（游客）</button>
    </form>
    <form id="registerForm" hidden>
      <input id="regUser" type="text" placeholder="用户名：3-20 位字母/数字/下划线" autocomplete="username" />
      <input id="regNick" type="text" placeholder="昵称（留空则同用户名）" />
      <input id="regPass" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" />
      <input id="regPass2" type="password" placeholder="确认密码" autocomplete="new-password" />
      <div class="avatar-label">选择头像</div>
      <div class="avatar-grid" id="regAvatarGrid"></div>
      <div class="custom-row">
        <input id="regEmoji" type="text" maxlength="8" placeholder="或输入自定义表情" />
        <div class="color-row" id="regColorRow"></div>
      </div>
      <div class="error" id="regError"></div>
      <button type="submit" class="btn">注册并开始</button>
    </form>
  </div>
</div>

<div class="overlay" id="profileOverlay" hidden>
  <div class="panel">
    <h2>个人资料</h2>
    <div class="profile-head">
      <div class="big-avatar" id="bigAvatar">🐍</div>
      <div>
        <div class="profile-nick" id="profileNick">昵称</div>
        <div class="profile-user">@<span id="profileUser">user</span></div>
      </div>
    </div>
    <div class="profile-stats">
      <div>最高分<b id="pBest">0</b></div>
      <div>总局数<b id="pGames">0</b></div>
      <div>总得分<b id="pTotal">0</b></div>
    </div>
    <div class="edit-section">
      <input id="editNick" type="text" placeholder="修改昵称" />
      <div class="avatar-label">头像</div>
      <div class="avatar-grid" id="editAvatarGrid"></div>
      <div class="custom-row">
        <input id="editEmoji" type="text" maxlength="8" placeholder="或输入自定义表情" />
        <div class="color-row" id="editColorRow"></div>
      </div>
      <div class="error" id="editError"></div>
      <button type="button" class="btn" id="saveProfileBtn">保存修改</button>
      <button type="button" class="btn danger" id="logoutBtn">退出登录</button>
    </div>
  </div>
</div>

<div class="overlay" id="musicOverlay" hidden>
  <div class="panel music-panel">
    <h2>音乐库</h2>
    <div class="tabs">
      <button type="button" class="tab active" id="musicTabBuiltin">内置</button>
      <button type="button" class="tab" id="musicTabPublic">公共库</button>
      <button type="button" class="tab" id="musicTabPrivate">私人库</button>
    </div>
    <div class="music-upload-row">
      <button type="button" class="btn ghost small" id="musicUploadBtn" hidden>⬆ 上传 MP3</button>
      <input type="file" id="musicFileInput" accept="audio/*" hidden />
    </div>
    <div class="music-list" id="musicTrackList"></div>
    <div class="error" id="musicError"></div>
    <div class="music-note" id="musicNote"></div>
    <button type="button" class="btn ghost" id="musicCloseBtn">关闭</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const COLS = 20, ROWS = 20, CELL = 20;
  const BASE_SPEED = 150, MIN_SPEED = 60, SPEED_STEP = 2;

  const USERS_KEY = "snake.users.v1";
  const SESSION_KEY = "snake.session.v1";
  const GUEST_KEY = "snake.guest.v1";
  const LEGACY_BEST_KEY = "snake-best-score";
  const MUSIC_CHOICE_KEY = "snake.musicChoice.v1";
  const MUSIC_DB_NAME = "snake-music-lib";
  const MUSIC_DB_VERSION = 1;
  const MUSIC_STORE = "tracks";
  const MAX_MUSIC_SIZE = 20 * 1024 * 1024;

  const AVATAR_EMOJIS = ["🐍", "🦊", "🐱", "🐼", "🐸", "🦁", "🐯", "🐰", "🦉", "🐙", "🦄", "🐢"];
  const AVATAR_COLORS = ["#ef4444", "#f59e0b", "#22c55e", "#3b82f6", "#8b5cf6", "#ec4899"];

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const startBtn = document.getElementById("startBtn");
  const userChip = document.getElementById("userChip");
  const soundBtn = document.getElementById("soundBtn");
  const chipAvatar = document.getElementById("chipAvatar");
  const chipName = document.getElementById("chipName");

  const authOverlay = document.getElementById("authOverlay");
  const tabLogin = document.getElementById("tabLogin");
  const tabRegister = document.getElementById("tabRegister");
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const loginUser = document.getElementById("loginUser");
  const loginPass = document.getElementById("loginPass");
  const loginError = document.getElementById("loginError");
  const guestBtn = document.getElementById("guestBtn");
  const regUser = document.getElementById("regUser");
  const regNick = document.getElementById("regNick");
  const regPass = document.getElementById("regPass");
  const regPass2 = document.getElementById("regPass2");
  const regEmoji = document.getElementById("regEmoji");
  const regError = document.getElementById("regError");
  const regAvatarGrid = document.getElementById("regAvatarGrid");
  const regColorRow = document.getElementById("regColorRow");

  const profileOverlay = document.getElementById("profileOverlay");
  const bigAvatar = document.getElementById("bigAvatar");
  const profileNick = document.getElementById("profileNick");
  const profileUser = document.getElementById("profileUser");
  const pBest = document.getElementById("pBest");
  const pGames = document.getElementById("pGames");
  const pTotal = document.getElementById("pTotal");
  const editNick = document.getElementById("editNick");
  const editEmoji = document.getElementById("editEmoji");
  const editError = document.getElementById("editError");
  const editAvatarGrid = document.getElementById("editAvatarGrid");
  const editColorRow = document.getElementById("editColorRow");
  const saveProfileBtn = document.getElementById("saveProfileBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = COLS * CELL * dpr;
  canvas.height = ROWS * CELL * dpr;
  ctx.scale(dpr, dpr);

  const DIRS = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },
    KeyW: { x: 0, y: -1 },
    KeyS: { x: 0, y: 1 },
    KeyA: { x: -1, y: 0 },
    KeyD: { x: 1, y: 0 },
  };

  let state = "ready";
  let snake, dir, pendingDir, food, score, speed, acc, lastTs;
  let currentUser = null;

  // ---- music library (storage + player) ----
  const audioEl = document.createElement("audio");
  audioEl.loop = true;
  audioEl.volume = 0.7;
  const previewEl = document.createElement("audio");
  let musicChoice = (function () {
    try {
      const raw = localStorage.getItem(MUSIC_CHOICE_KEY);
      if (!raw) return { mode: "builtin" };
      const c = JSON.parse(raw);
      return c && (c.mode === "builtin" || c.mode === "public" || c.mode === "private") ? c : { mode: "builtin" };
    } catch (e) { return { mode: "builtin" }; }
  })();
  let musicTracks = [];
  let musicTab = "builtin";
  let mp3Url = null;
  let previewUrl = null;
  let previewId = null;

  function currentOwner() { return currentUser ? currentUser : "guest"; }

  function saveMusicChoice() {
    try { localStorage.setItem(MUSIC_CHOICE_KEY, JSON.stringify(musicChoice)); } catch (e) { /* ignore */ }
  }

  // ---- audio (Web Audio API) ----
  const SOUND_KEY = "snake.sound.v1";
  const BPM = 112;
  const BEAT = 60 / BPM;
  const MELODY = [
    [60, 1], [64, 1], [67, 1], [72, 1], [69, 0.5], [72, 0.5], [67, 1], [64, 1],
    [62, 1], [64, 1], [67, 1], [71, 1], [69, 0.5], [67, 0.5], [64, 1], [62, 1],
    [60, 1], [64, 1], [67, 1], [72, 1], [76, 0.5], [72, 0.5], [69, 1], [67, 1],
    [65, 1], [67, 1], [69, 1], [74, 1], [72, 0.5], [69, 0.5], [67, 1], [72, 2],
  ];
  const BASS = [48, 48, 53, 55];

  let audioCtx = null;
  let masterGain = null;
  let soundOn = (function () {
    try { return localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) { return true; }
  })();
  let musicTimer = null;
  let nextNoteTime = 0;
  let melodyStep = 0;

  function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = soundOn ? 1 : 0;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function tone(freq, time, dur, type, vol, dest) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(vol || 0.12, time + 0.02);
    g.gain.setValueAtTime(vol || 0.12, time + Math.max(0.05, dur - 0.08));
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(g);
    g.connect(dest || masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.05);
  }

  function playEat() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const foods = Math.min(Math.floor(score / 10), 20);
    const base = 440 * Math.pow(1.06, foods);
    tone(base, t, 0.12, "square", 0.08);
    tone(base * 1.5, t + 0.05, 0.12, "square", 0.06);
  }

  function playDeath() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    tone(220, t, 0.55, "sawtooth", 0.14);
    tone(110, t + 0.05, 0.6, "triangle", 0.1);
  }

  function playWin() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    [60, 64, 67, 72, 76].forEach((m, i) => tone(midiToFreq(m), t + i * 0.12, 0.25, "triangle", 0.12));
  }

  function scheduleNote(midi, time, dur) {
    tone(midiToFreq(midi), time, dur, "triangle", 0.09);
  }

  function scheduleBass(midi, time) {
    tone(midiToFreq(midi), time, BEAT * 3.8, "sine", 0.07);
  }

  function startSynthMusic() {
    if (!audioCtx || !soundOn || musicTimer) return;
    nextNoteTime = audioCtx.currentTime + 0.05;
    melodyStep = 0;
    musicTimer = setInterval(() => {
      if (!audioCtx) return;
      while (nextNoteTime < audioCtx.currentTime + 0.2) {
        if (state === "running" && soundOn) {
          const n = MELODY[melodyStep % MELODY.length];
          scheduleNote(n[0], nextNoteTime, n[1] * BEAT * 0.95);
          if (melodyStep % 4 === 0) {
            scheduleBass(BASS[Math.floor(melodyStep / 4) % BASS.length], nextNoteTime);
          }
        }
        nextNoteTime += BEAT;
        melodyStep = (melodyStep + 1) % MELODY.length;
      }
    }, 100);
  }

  function stopMusic() {
    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
    if (audioEl && !audioEl.paused) audioEl.pause();
  }

  // ---- music library (IndexedDB) ----
  const musicBtn = document.getElementById("musicBtn");
  const musicOverlay = document.getElementById("musicOverlay");
  const musicTabBuiltin = document.getElementById("musicTabBuiltin");
  const musicTabPublic = document.getElementById("musicTabPublic");
  const musicTabPrivate = document.getElementById("musicTabPrivate");
  const musicTrackList = document.getElementById("musicTrackList");

  function startMusic() {
    stopMusic();
    if (!soundOn) return;
    if (musicChoice.mode === "builtin") { startSynthMusic(); return; }
    const track = musicTracks.find((t) => t.id === musicChoice.id && t.scope === musicChoice.mode);
    if (track) playMp3Track(track);
    else startSynthMusic();
  }

  function playMp3Track(track) {
    if (!track || !track.blob) return;
    if (mp3Url) { URL.revokeObjectURL(mp3Url); mp3Url = null; }
    mp3Url = URL.createObjectURL(track.blob);
    audioEl.src = mp3Url;
    audioEl.loop = true;
    audioEl.muted = !soundOn;
    audioEl.volume = 0.7;
    audioEl.play().catch(() => { /* ignore */ });
  }

  function openMusicDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("当前浏览器不支持 IndexedDB"));
      let req;
      try { req = window.indexedDB.open(MUSIC_DB_NAME, MUSIC_DB_VERSION); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(MUSIC_STORE)) {
          db.createObjectStore(MUSIC_STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error("打开音乐库失败"));
    });
  }

  function idbRequest(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error("IndexedDB 操作失败"));
    });
  }

  async function musicGetAll() {
    const db = await openMusicDB();
    try {
      const tx = db.transaction(MUSIC_STORE, "readonly");
      const all = await idbRequest(tx.objectStore(MUSIC_STORE).getAll());
      return all || [];
    } finally {
      db.close();
    }
  }

  async function musicPut(track) {
    const db = await openMusicDB();
    try {
      const tx = db.transaction(MUSIC_STORE, "readwrite");
      await idbRequest(tx.objectStore(MUSIC_STORE).put(track));
    } finally {
      db.close();
    }
  }

  async function musicRemove(id) {
    const db = await openMusicDB();
    try {
      const tx = db.transaction(MUSIC_STORE, "readwrite");
      await idbRequest(tx.objectStore(MUSIC_STORE).delete(id));
    } finally {
      db.close();
    }
  }

  async function refreshMusicTracks() {
    let all = [];
    try { all = await musicGetAll(); } catch (e) { all = []; }
    const owner = currentOwner();
    musicTracks = all.filter((t) => t.scope === "public" || (t.scope === "private" && t.owner === owner));
    if (musicChoice.mode !== "builtin" && !musicTracks.some((t) => t.id === musicChoice.id)) {
      musicChoice = { mode: "builtin" };
      saveMusicChoice();
    }
    if (state === "running" && soundOn) startMusic();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function fmtSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function isPicked(track) {
    return musicChoice.mode === track.scope && musicChoice.id === track.id;
  }

  function trackRowHTML(track) {
    const picked = isPicked(track);
    const canDelete = track.scope === "public" ? track.owner === currentOwner() : true;
    const previewing = previewId === track.id && !previewEl.paused;
    return (
      '<div class="track-item' + (picked ? " active" : "") + '">' +
        '<div class="track-info">' +
          '<div class="track-name">' + esc(track.name) + (picked ? ' <span class="track-badge">使用中</span>' : "") + "</div>" +
          '<div class="track-meta">' + esc(track.scope === "public" ? "公共库 · " : "私人库 · ") + fmtSize(track.size) + " · 上传者 " + esc(track.owner) + "</div>" +
        "</div>" +
        '<button type="button" class="mini-btn" data-act="preview" data-id="' + esc(track.id) + '">' + (previewing ? "⏸" : "▶") + "</button>" +
        '<button type="button" class="mini-btn pick" data-act="pick" data-id="' + esc(track.id) + '">' + (picked ? "使用中" : "选用") + "</button>" +
        (canDelete ? '<button type="button" class="mini-btn danger" data-act="del" data-id="' + esc(track.id) + '">删除</button>' : "") +
      "</div>"
    );
  }

  function stopPreview() {
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    if (previewId) { previewEl.pause(); previewEl.removeAttribute("src"); previewId = null; }
  }

  function togglePreview(track) {
    if (previewId === track.id && !previewEl.paused) { stopPreview(); renderMusicLib(); return; }
    stopPreview();
    previewUrl = URL.createObjectURL(track.blob);
    previewEl.src = previewUrl;
    previewEl.loop = false;
    previewEl.muted = !soundOn;
    previewEl.volume = 0.7;
    previewEl.play().catch(() => { /* ignore */ });
    previewId = track.id;
    renderMusicLib();
  }

  function renderMusicLib() {
    musicTabBuiltin.classList.toggle("active", musicTab === "builtin");
    musicTabPublic.classList.toggle("active", musicTab === "public");
    musicTabPrivate.classList.toggle("active", musicTab === "private");
    musicUploadBtn.hidden = musicTab === "builtin";
    musicNote.textContent = musicTab === "builtin"
      ? "内置音乐由浏览器实时合成，无需任何文件。"
      : musicTab === "public"
        ? "公共库：所有账号共享，上传后大家都能用；删除仅限上传者本人。单首不超过 20MB。"
        : "私人库：仅当前账号可见可用，上传后只属于自己，换账号看不到。单首不超过 20MB。";
    musicError.textContent = "";
    if (musicTab === "builtin") {
      const picked = musicChoice.mode === "builtin";
      musicTrackList.innerHTML =
        '<div class="track-item' + (picked ? " active" : "") + '">' +
          '<div class="track-info">' +
            '<div class="track-name">内置轻快旋律' + (picked ? ' <span class="track-badge">使用中</span>' : "") + "</div>" +
            '<div class="track-meta">Web Audio 实时合成 · 无需文件</div>' +
          "</div>" +
          '<button type="button" class="mini-btn pick" data-act="pick-builtin">' + (picked ? "使用中" : "选用") + "</button>" +
        "</div>";
      return;
    }
    const list = musicTracks.filter((t) => t.scope === musicTab);
    musicTrackList.innerHTML = list.length
      ? list.map(trackRowHTML).join("")

  }

  async function deleteTrack(track) {
    if (track.scope === "private" && track.owner !== currentOwner()) return;
    if (track.scope === "public" && track.owner !== currentOwner()) return;
    if (!window.confirm("确定删除「" + track.name + "」吗？")) return;
    if (previewId === track.id) stopPreview();
    try {
      await musicRemove(track.id);
      if (isPicked(track)) {
        musicChoice = { mode: "builtin" };
        saveMusicChoice();
      }
      await refreshMusicTracks();
      renderMusicLib();
    } catch (err) {
      musicError.textContent = "删除失败：" + (err && err.message ? err.message : "存储不可用");
    }
  }

    if (!btn || !btn.dataset.act) return;
    const act = btn.dataset.act;
    if (act === "pick-builtin") {
      stopPreview();
      musicChoice = { mode: "builtin" };
      saveMusicChoice();
      renderMusicLib();
      if (state === "running") startMusic();
      return;

    const id = btn.dataset.id;
    const track = musicTracks.find((t) => t.id === id);

    if (act === "pick") {

      musicChoice = { mode: track.scope, id: track.id };
      saveMusicChoice();
      renderMusicLib();
      if (state === "running") startMusic();

    } else if (act === "del") {

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function saveJSON(key, val) {

  }

  function migrateLegacyBest() {

    return { best: legacy > 0 ? legacy : 0, games: 0, totalScore: 0 };

  function randomSalt() {
    const arr = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr);
    else for (let i = 0; i < arr.length; i++) arr[i] = Math.floor(Math.random() * 256);
    return Array.from(arr).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  async function hashPassword(password, salt) {
    const data = new TextEncoder().encode(salt + ":" + password);
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    let h = 0x811c9dc5;
    for (const b of data) { h ^= b; h = Math.imul(h, 0x01000193); }
    return "fnv-" + (h >>> 0).toString(16);
  }

      gridEl.appendChild(b);

    AVATAR_COLORS.forEach((c) => {

      b.onclick = () => { setSel(Object.assign({}, getSel(), { color: c })); sync(); };
      colorRowEl.appendChild(b);

  }

  function reset() {
    snake = [
      { x: 9, y: 10 },
      { x: 8, y: 10 },
      { x: 7, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
    food = spawnFood();
    score = 0;
    speed = BASE_SPEED;
    acc = 0;
    lastTs = 0;
    scoreEl.textContent = score;
    bestEl.textContent = statsOf().best;
    startBtn.textContent = "重新开始";
  }

  function resetGameData() {
    reset();
  }

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    if (free.length === 0) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function setDir(d) {
    if (d.x === -dir.x && d.y === -dir.y) return;
    if (d.x === dir.x && d.y === dir.y) return;
    pendingDir = d;
  }

  function recordGame() {
    const st = statsOf();
    st.games += 1;
    st.totalScore += score;
    if (score > st.best) {
      st.best = score;
      bestEl.textContent = st.best;
    }
    persistStats();
  }

  function step() {
    dir = pendingDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }

    const willEat = food && head.x === food.x && head.y === food.y;
    const bodyToCheck = willEat ? snake : snake.slice(0, -1);
    if (bodyToCheck.some((s) => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (willEat) {
      score += 10;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
      food = spawnFood();
      playEat();
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function win() {
    state = "over";
    stopMusic();
    playWin();
    recordGame();
    draw();
  }

  function gameOver() {
    state = "over";
    stopMusic();
    playDeath();
    recordGame();
    draw();
  }

  function startGame() {
    if (!authOverlay.hidden || !profileOverlay.hidden || !musicOverlay.hidden) return;
    reset();
    state = "running";
    ensureAudio();
    startMusic();
  }

  function togglePause() {
    if (state === "running") {
      state = "paused";
      acc = 0;
      stopMusic();
    } else if (state === "paused") {
      state = "running";
      lastTs = 0;
      ensureAudio();
      startMusic();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = "rgba(148, 163, 184, 0.045)";
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }

    if (food) {
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(fx, fy, CELL * 0.42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fca5a5";
      ctx.beginPath();
      ctx.arc(fx - 2.5, fy - 2.5, CELL * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#22c55e";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(fx + 1, fy - CELL * 0.42);
      ctx.quadraticCurveTo(fx + 6, fy - CELL * 0.62, fx + 9, fy - CELL * 0.5);
      ctx.stroke();
    }

    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const g = Math.round(210 - t * 90);
      ctx.fillStyle = `rgb(34, ${g}, 94)`;
      const m = i === 0 ? 1.5 : 2.5;
      roundRect(s.x * CELL + m, s.y * CELL + m, CELL - m * 2, CELL - m * 2, i === 0 ? 8 : 6);
      ctx.fill();
    }

    const head = snake[0];
    if (state !== "ready") {
      const cx = head.x * CELL + CELL / 2;
      const cy = head.y * CELL + CELL / 2;
      const ex = Math.abs(dir.x) === 1 ? dir.x * 4 : 0;
      const ey = Math.abs(dir.y) === 1 ? dir.y * 4 : 0;
      const px = Math.abs(dir.y) === 1 ? 4 : 0;
      const py = Math.abs(dir.x) === 1 ? 4 : 0;
      for (const [ox, oy] of [[ex + px, ey + py], [ex - px, ey - py]]) {
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(cx + ox, cy + oy, 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(cx + ox + dir.x * 1.2, cy + oy + dir.y * 1.2, 1.7, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (state === "ready" || state === "paused" || state === "over") {
      ctx.fillStyle = "rgba(2, 6, 23, 0.72)";
      ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);

      let title, sub;
      if (state === "ready") {
        title = "准备开始";
        sub = "按下空格或点击按钮";
      } else if (state === "paused") {
        title = "已暂停";
        sub = "按下空格继续";
      } else if (food === null && score > 0) {
        title = "你赢了！";
        sub = "吃满了整张地图 🏆";
      } else {
        title = "游戏结束";
        const isBest = score >= statsOf().best && score > 0;
        sub = `本局得分 ${score}${isBest ? " · 新纪录！" : ""}`;
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#4ade80";
      ctx.font = "bold 34px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillText(title, COLS * CELL / 2, ROWS * CELL / 2 - 12);
      ctx.fillStyle = "#cbd5e1";
      ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
      ctx.fillText(sub, COLS * CELL / 2, ROWS * CELL / 2 + 26);
    }
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;
    if (state === "running") {
      acc += dt;
      while (acc >= speed) {
        acc -= speed;
        step();
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("keydown", (e) => {
    if (!authOverlay.hidden || !profileOverlay.hidden || !musicOverlay.hidden) return;
    if (DIRS[e.code]) {
      e.preventDefault();
      if (state === "running") setDir(DIRS[e.code]);
      else if (state === "ready" || state === "over") startGame();
    } else if (e.code === "Space") {
      e.preventDefault();
      if (state === "ready") startGame();
      else if (state === "running" || state === "paused") togglePause();
    } else if (e.code === "KeyR") {
      if (state === "running" || state === "paused" || state === "over") startGame();
    } else if (e.code === "Escape") {
      profileOverlay.hidden = true;
      musicOverlay.hidden = true;
    }
  });

  startBtn.addEventListener("click", () => {
    if (state === "running" || state === "paused") togglePause();
    else startGame();
  });

  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      setDir({ x: 0, y: dy > 0 ? 1 : -1 });
    }
    if ((state === "ready" || state === "over") && authOverlay.hidden && profileOverlay.hidden && musicOverlay.hidden) startGame();
  }, { passive: true });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "running") togglePause();
  });

  const savedUser = (function () {
    try {
      const u = localStorage.getItem(SESSION_KEY);
      return u && users[u] ? u : null;
    } catch (e) { return null; }
  })();

  if (savedUser) {
    currentUser = savedUser;
    updateChip();
  } else {
    authOverlay.hidden = false;
  }

  refreshMusicTracks();

  reset();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
