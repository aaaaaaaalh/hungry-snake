name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable GitHub Pages
        run: |
          echo "==> Trying to enable GitHub Pages via API..."
          resp=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "$resp"
          code=$(echo "$resp" | grep -o 'HTTP_CODE:.*' | cut -d: -f2)
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::Could not enable Pages via API (HTTP $code). Please enable it in repo Settings -> Pages -> Source: GitHub Actions"
            exit 1
          fi
          echo "==> Pages enabled (HTTP $code), waiting for site to be ready..."
          for i in $(seq 1 24); do
            s=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages)
            echo "Pages site check #$i: HTTP $s"
            [ "$s" = "200" ] && { echo "==> Pages site is ready"; break; }
            sleep 5
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: snake-game
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
